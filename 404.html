  <script>
    /* Runs before the page paints, so there's no flash of the wrong theme.
       Also marks the document as JavaScript-capable for the CSS. */
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      var choice;
      try { choice = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
      if (choice !== 'light' && choice !== 'dark') {
        choice = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', choice);
    })();
  </script>
